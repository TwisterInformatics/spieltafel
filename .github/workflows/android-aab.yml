# Baut das Android App Bundle (AAB) für Google Play.
#
# Signiert wird mit dem Upload-Schlüssel aus den Repository-Secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64  Keystore-Datei, base64-kodiert
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD
#   ANDROID_UPLOAD_KEY_ALIAS
#   ANDROID_UPLOAD_KEY_PASSWORD
# Die Signierung macht plugins/withReleaseSigning.js. Fehlen die Secrets, wird mit einem Wegwerf-Schlüssel signiert; dieses Test-AAB lehnt Google Play ab.
#
# Die versionCode ist die Laufnummer dieses Workflows, damit jeder Upload eine höhere Nummer hat.

name: Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests und Typprüfung
        run: |
          npm test
          npm run typecheck

      - name: versionCode setzen
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          '

      - name: Android-Projekt erzeugen
        run: npx expo prebuild --platform android --no-install

      - name: Upload-Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Ohne Secrets mit einem Wegwerf-Schlüssel signieren, damit der Signierweg trotzdem geprüft wird.
            echo "::warning::Keine Signier-Secrets gesetzt. Das AAB ist nur ein Test und wird von Google Play abgelehnt."
            KEYSTORE_PASSWORD=testtest KEY_PASSWORD=testtest KEY_ALIAS=test
            keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/upload.jks" -alias test -keyalg RSA -keysize 2048 \
              -validity 30 -storepass testtest -keypass testtest -dname "CN=Test" >/dev/null
            AAB_LABEL=test-nicht-fuer-play
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            AAB_LABEL=$GITHUB_RUN_NUMBER
          fi
          # Gradle liest ORG_GRADLE_PROJECT_* als Projekt-Eigenschaften (siehe plugins/withReleaseSigning.js)
          {
            echo "ORG_GRADLE_PROJECT_SPIELTAFEL_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "ORG_GRADLE_PROJECT_SPIELTAFEL_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_SPIELTAFEL_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_SPIELTAFEL_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            echo "AAB_NAME=spieltafel-${AAB_LABEL}.aab"
          } >> "$GITHUB_ENV"

      - name: AAB bauen
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Signatur prüfen
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/$AAB_NAME"
          keytool -printcert -jarfile "out/$AAB_NAME" | head -5
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: spieltafel-aab
          path: out/*.aab
          retention-days: 30
